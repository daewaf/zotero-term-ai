name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/core.test.cjs
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --check source/bootstrap.js && node --check source/content/dialog.js && node --check source/content/preferences.js
      - run: python build.py
