name: Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/core.test.cjs
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --check source/bootstrap.js && node --check source/content/dialog.js && node --check source/content/preferences.js
      - name: Build XPI and update manifest
        run: python build.py
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.xpi dist/updates.json dist/SHA256SUMS.txt --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
